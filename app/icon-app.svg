<!-- App icon variant of icon.svg: same waves, square canvas cropped around them, with the
     colours flipped to white on black. The menu bar variant is icon-menubar.svg. -->
<svg
  width="460"
  height="460"
  viewBox="25 18 460 460"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Near-black, not #000: a pure black tile vanishes into a dark Dock or Finder sidebar.
         The slight top-to-bottom fall-off also keeps the square from looking like a hole. -->
    <linearGradient id="tile" x1="0" y1="18" x2="0" y2="478" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23262B"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>
  </defs>

  <!-- Rounded, not square: macOS draws app icons in a rounded square and a hard-cornered
       tile reads as foreign next to everything else in Finder. -->
  <rect x="25" y="18" width="460" height="460" rx="103" ry="103" fill="url(#tile)"/>

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
  >
    <path d="
      M 80 170
      C 125 145, 150 145, 175 185
      C 205 235, 235 245, 265 210
      C 295 175, 315 145, 350 150
      C 390 155, 395 205, 430 225
    "/>

    <path d="
      M 80 205
      C 125 180, 150 180, 175 220
      C 205 270, 235 280, 265 245
      C 295 210, 315 180, 350 185
      C 390 190, 395 240, 430 260
    "/>

    <path d="
      M 80 240
      C 125 215, 150 215, 175 255
      C 205 305, 235 315, 265 280
      C 295 245, 315 215, 350 220
      C 390 225, 395 275, 430 295
    "/>

    <path d="
      M 80 275
      C 125 250, 150 250, 175 290
      C 205 340, 235 350, 265 315
      C 295 280, 315 250, 350 255
      C 390 260, 395 310, 430 330
    "/>
  </g>
</svg>
