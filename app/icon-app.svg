    <linearGradient id="wave" x1="0" y1="0" x2="512" y2="0">
      <stop offset="0%" stop-color="#55C7F2"/>
      <stop offset="100%" stop-color="#3568E8"/>
    </linearGradient>
  </defs>

  <g
